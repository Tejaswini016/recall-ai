# Test-only overrides. The datasource is supplied by Testcontainers via @ServiceConnection.
recallai:
  security:
    jwt:
      secret: test-only-secret-that-is-long-enough-for-hmac-sha256-signing
      expiration-minutes: 60
  cors:
    allowed-origins: http://localhost:3000
  analytics:
    weak-topic-min-reviews: 3
    weak-topic-quality-threshold: 3.0
    weak-topic-recent-window: 10
  material:
    max-chars: 60000
    max-chunks: 6
  ai:
    api-key: ""
    model: test-model
    effort: medium
    max-tokens: 4096
    max-input-chars: 12000
    max-cards: 30
    max-quiz-questions: 15
    validation-retries: 1
    transport-retries: 0
    rate-limit-per-hour: 20
    demo-mode: false
    provider: anthropic
    gemini-api-key: ""
    gemini-model: gemini-3.6-flash
    groq-api-key: ""
    groq-model: llama-3.3-70b-versatile
    groq-base-url: https://api.groq.com/openai/v1

logging:
  level:
    com.recallai: DEBUG
