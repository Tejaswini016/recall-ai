spring:
  application:
    name: recall-ai
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/recallai}
    username: ${DATABASE_USERNAME:recallai}
    password: ${DATABASE_PASSWORD:recallai}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    # Flyway owns the schema. Hibernate only verifies that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:10MB}
      max-request-size: ${MAX_UPLOAD_SIZE:10MB}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.recallai: ${LOG_LEVEL:INFO}

recallai:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  review:
    # A card whose SM-2 interval reaches this many days counts as mastered.
    mastered-interval-days: ${MASTERED_INTERVAL_DAYS:21}
  ai:
    api-key: ${CLAUDE_API_KEY:}
    model: ${CLAUDE_MODEL:claude-sonnet-5}
    rate-limit-per-hour: ${AI_RATE_LIMIT:20}
