spring:
  application:
    name: recall-ai
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/recallai}
    username: ${DATABASE_USERNAME:recallai}
    password: ${DATABASE_PASSWORD:recallai}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    # Flyway owns the schema. Hibernate only verifies that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:10MB}
      max-request-size: ${MAX_UPLOAD_SIZE:10MB}

server:
  port: ${SERVER_PORT:8080}
  # Finish in-flight requests (including slow AI calls) before stopping.
  shutdown: graceful
  compression:
    enabled: true
    min-response-size: 1KB
  error:
    include-message: never
    include-stacktrace: never
  # Trust X-Forwarded-* headers from the reverse proxy / load balancer in front of the app.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  # Disable in production if the API should not advertise its surface.
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  # Every line carries the request id and, once authenticated, the user id.
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%X{requestId:-}] [user:%X{userId:-}] %-36.36logger{36} : %m%n"
  level:
    root: INFO
    com.recallai: ${LOG_LEVEL:INFO}

recallai:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  review:
    # A card whose SM-2 interval reaches this many days counts as mastered.
    mastered-interval-days: ${MASTERED_INTERVAL_DAYS:21}
  analytics:
    # A topic is weak once it has this many reviews and the average quality of its most
    # recent reviews falls below the threshold (SM-2 quality 0-5; 3 is a passing recall).
    weak-topic-min-reviews: ${WEAK_TOPIC_MIN_REVIEWS:3}
    weak-topic-quality-threshold: ${WEAK_TOPIC_QUALITY_THRESHOLD:3.0}
    weak-topic-recent-window: ${WEAK_TOPIC_RECENT_WINDOW:10}
  material:
    # Largest study text (after extraction) accepted for one generation, and how many
    # model-sized chunks it may be split into. Together these bound the cost of a request.
    max-chars: ${MATERIAL_MAX_CHARS:60000}
    max-chunks: ${MATERIAL_MAX_CHUNKS:6}
  ai:
    api-key: ${CLAUDE_API_KEY:}
    # The model id is part of every cache key, so changing it never serves stale output.
    model: ${CLAUDE_MODEL:claude-opus-5}
    effort: ${CLAUDE_EFFORT:medium}
    max-tokens: ${CLAUDE_MAX_TOKENS:8192}
    max-input-chars: ${AI_MAX_INPUT_CHARS:12000}
    max-cards: ${AI_MAX_CARDS:30}
    max-quiz-questions: ${AI_MAX_QUIZ_QUESTIONS:15}
    validation-retries: ${AI_VALIDATION_RETRIES:1}
    transport-retries: ${AI_TRANSPORT_RETRIES:1}
    rate-limit-per-hour: ${AI_RATE_LIMIT:20}
    # true = build cards/quizzes from the notes with local heuristics instead of Claude (no key, not AI).
    demo-mode: ${AI_DEMO_MODE:false}
    # anthropic (default) or gemini. Gemini Flash models have a free developer tier.
    provider: ${AI_PROVIDER:anthropic}
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-2.5-flash}
